name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: 'main'
    permissions: 
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "image_tag=prod" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=test" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        shell: bash
        run: |
          OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}
          IMAGE_REPO="ghcr.io/$OWNER_LC/conurban-dj-api"
          docker build -t "$IMAGE_REPO:$IMAGE_TAG" .
          docker push "$IMAGE_REPO:$IMAGE_TAG"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: 'main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          APP_CONTAINER: starproject-api
          APP_HOST_PORT: "8020"
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: OWNER,GHCR_TOKEN,IMAGE_TAG,APP_CONTAINER,APP_HOST_PORT
          script: |
            set -e
            OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
            IMAGE_REPO="ghcr.io/$OWNER_LC/conurban-dj-api"

            sudo -n systemctl start docker || true
            echo "$GHCR_TOKEN" | sudo -n docker login ghcr.io -u "$OWNER" --password-stdin
            sudo -n docker pull "$IMAGE_REPO:$IMAGE_TAG"
            sudo -n docker stop "$APP_CONTAINER" || true
            sudo -n docker rm "$APP_CONTAINER" || true
            sudo -n docker run -d --name "$APP_CONTAINER" \
              -p "$APP_HOST_PORT:8000" \
              --restart unless-stopped \
              "$IMAGE_REPO:$IMAGE_TAG"
